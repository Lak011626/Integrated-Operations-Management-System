spring.application.name=IOMS
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ioms_enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=IOMS-Secret-Key-For-Login-2026-Development
app.jwt.expiration-ms=86400000