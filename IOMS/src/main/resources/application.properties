spring.application.name=IOMS
server.port=8080

# 1. Đổi tên database từ ioms_db thành ioms_enterprise_db (để khớp với script SQL bạn vừa chạy)
spring.datasource.url=jdbc:mysql://localhost:3306/ioms_enterprise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# 2. CẤU HÌNH QUAN TRỌNG: Đổi từ "update" thành "validate"
# Việc này giúp bảo vệ cấu trúc bảng, Spring Boot sẽ chỉ kiểm tra xem Entity có khớp với DB không chứ không tự ý xóa/sửa bảng của bạn.
spring.jpa.hibernate.ddl-auto=validate

# 3. Hiển thị SQL log đẹp và dễ đọc hơn khi debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect