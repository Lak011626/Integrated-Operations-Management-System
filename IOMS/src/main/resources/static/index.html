<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập IOMS</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>IOMS</h1>
          <p>Hệ thống quản lý vận hành</p>
        </div>

        <div id="login-message" class="alert info">
          Vui lòng đăng nhập để tiếp tục.
        </div>

        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input id="username" type="text" placeholder="Nhập username" />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input id="password" type="password" placeholder="Nhập mật khẩu" />
        </div>

        <button class="login-btn" onclick="login()">Đăng nhập</button>

        <div class="login-footer">
          <button class="secondary-btn" onclick="testConnection()">
            Kiểm tra kết nối
          </button>
        </div>

        <div id="api-result"></div>
      </div>
    </div>

    <script src="/js/api.js"></script>
  </body>
</html>
